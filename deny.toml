# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# Run with `just deny` or `cargo deny check`.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Unmaintained, not vulnerable. superdeck-render keeps resvg on the release
# whose font database matches cosmic-text's (fontdb 0.23), so SVG text and
# titles share one set of fonts. Upgrade resvg once cosmic-text moves to a
# newer fontdb, and drop these.
ignore = [
  { id = "RUSTSEC-2026-0192", reason = "ttf-parser, via fontdb 0.23 in cosmic-text and resvg 0.47" },
  { id = "RUSTSEC-2026-0206", reason = "rustybuzz, via resvg 0.47; see above" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Licenses compatible with distributing the combined work under GPL-3.0-or-later.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "GPL-3.0-or-later",
  "ISC",
  "LGPL-3.0-or-later",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
