name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # rustup installs the toolchain pinned in rust-toolchain.toml on first use.
      - name: Detect crates
        id: crates
        run: |
          if cargo metadata --no-deps --format-version 1 | jq -e '.packages | length > 0' >/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Rust crates yet; skipping Rust checks."
          fi

      - name: Install system libraries
        if: steps.crates.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libudev-dev libssl-dev

      - uses: Swatinem/rust-cache@v2
        if: steps.crates.outputs.present == 'true'

      - name: rustfmt
        if: steps.crates.outputs.present == 'true'
        run: cargo fmt --all --check

      - name: clippy
        if: steps.crates.outputs.present == 'true'
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: test
        if: steps.crates.outputs.present == 'true'
        run: cargo test --workspace --locked

      - name: cargo-deny
        if: steps.crates.outputs.present == 'true'
        uses: EmbarkStudios/cargo-deny-action@v2

  js:
    name: JS / TS
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
