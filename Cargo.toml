[workspace]
resolver = "3"
# Every crate under crates/ is a member. Add "app/src-tauri" once it exists.
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/zhappysnake/superdeck"
publish = false

[workspace.dependencies]
# Shared dependency versions go here; crates use `foo.workspace = true`.
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
cosmic-text = "0.19.0"
data-url = "0.3.2"
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
resvg = { version = "0.47.0", default-features = false, features = ["raster-images", "text"] }
rustix = { version = "1.1.5", features = ["event"] }
superdeck-device = { path = "crates/superdeck-device" }
sys-locale = "0.3.2"
thiserror = "2.0.21"
udev = "0.9.3"

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
