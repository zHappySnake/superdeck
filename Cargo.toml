[workspace]
resolver = "3"
# Every crate under crates/ is a member. Add "app/src-tauri" once it exists.
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.97"
license = "GPL-3.0-or-later"
repository = "https://github.com/zhappysnake/superdeck"
publish = false

[workspace.dependencies]
# Shared dependency versions go here; crates use `foo.workspace = true`.
anyhow = "1.0.104"
base64 = "0.23.1"
boon = "0.6.1"
clap = { version = "4.6.7", features = ["derive"] }
cosmic-text = "0.19.0"
data-url = "0.3.2"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
hidapi = { version = "2.6.7", default-features = false, features = ["linux-static-hidraw"] }
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png"] }
resvg = { version = "0.49.0", default-features = false, features = ["raster-images", "text"] }
rustix = { version = "1.1.5", features = ["event"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.151", features = ["preserve_order"] }
sha2 = "0.11.0"
superdeck-core = { path = "crates/superdeck-core" }
superdeck-device = { path = "crates/superdeck-device" }
superdeck-plugin-host = { path = "crates/superdeck-plugin-host" }
superdeck-render = { path = "crates/superdeck-render" }
sys-locale = "0.3.2"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["handshake"] }
udev = "0.9.3"
uuid = { version = "1.28.0", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "deny"
unused_qualifications = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
dbg_macro = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
